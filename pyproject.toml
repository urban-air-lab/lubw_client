[project]
name = "lubw-client"
version = "0.2.0"
description = "client to call sensor data from Landesamt für Umwelt Baden Würrtemberg (LUBW)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "apscheduler>=3.11.2",
    "isort>=9.0.1",
    "mypy>= 2.3.1",
    "numpy>= 2.4.6",
    "paho-mqtt>=2.1.0",
    "pandas>=3.0.6",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "ruff>=0.16.8",
    "ual",
]

[tool.uv.sources]
ual = { git = "https://github.com/urban-air-lab/common" }
